name: tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGGRAPH_STRICT_MSGPACK: "true"
      VOLCENGINE_API_KEY: "ci-placeholder"
      BAIDU_API_KEY: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python
        run: python -m compileall -q .
      - name: Unit tests
        run: pytest -q
